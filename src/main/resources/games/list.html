<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Library</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-left">
                <h1>Game Library</h1>
                <p class="subtitle">Manage your collection</p>
            </div>
        </header>

        <nav>
            <a th:href="@{/games}" class="active">All Games</a>
            <a th:href="@{/games/new}">Add New Game</a>
        </nav>

        <div class="main-content">
            <h2>All Games</h2>

            <form th:action="@{/games}" method="get" class="search-form">
                <input
                        type="text"
                        name="query"
                        placeholder="Search by title or developer..."
                        th:value="${query}"
                >
                <button type="submit">Search</button>
                <a th:href="@{/games}" class="btn-clear">Clear</a>
            </form>

            <table th:if="${!#lists.isEmpty(games)}">
                <thead>
                <tr>
                    <th>Title</th>
                    <th>Developer</th>
                    <th>Release Date</th>
                    <th>Publisher</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="game : ${games}">
                    <td th:text="${game.title}">Title</td>
                    <td th:text="${game.developer}">Developer</td>
                    <td th:text="${game.releaseDate}">2022-01-01</td>
                    <td th:text="${game.publisher}">Publisher</td>
                    <td class="actions-cell">
                        <a th:href="@{/games/{id}(id=${game.id})}" class="btn btn-primary btn-small">View</a>
                        <a th:href="@{/games/{id}/edit(id=${game.id})}" class="btn btn-secondary btn-small">Edit</a>
                        <form th:action="@{/games/{id}/delete(id=${game.id})}" method="post" class="delete-form" onsubmit="return confirm('Are you sure you want to delete this game?');">
                            <button type="submit" class="btn btn-danger btn-small">Delete</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>

            <div class="empty-state" th:if="${#lists.isEmpty(games)}">
                <div class="empty-state-icon">⊘</div>
                <p>No games found in the library.</p>
                <a th:href="@{/games/new}" class="btn btn-primary">Add Your First Game</a>
            </div>
        </div>
    </div>
</body>
</html>

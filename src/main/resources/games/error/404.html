<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error 404 - Game Library</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <div class="main-content error-page">
            <h1>404</h1>
            <h2>Page Not Found</h2>

            <div class="error-message" th:if="${message}">
                <strong>Error:</strong> <span th:text="${message}">Resource not found</span>
            </div>

            <p style="margin: 20px 0; color: var(--text-secondary);">
                The game you're looking for doesn't exist in our library.
            </p>

            <div class="actions">
                <a th:href="@{/games}" class="btn btn-primary">Browse All Games</a>
                <a th:href="@{/games/new}" class="btn btn-secondary">Add New Game</a>
            </div>
        </div>
    </div>
</body>
</html>
